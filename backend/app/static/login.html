<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · 心理健康测评系统</title>
<style>
  /* v-cloak：Vue 挂载前隐藏模板，杜绝键盘等元素闪现 */
  [v-cloak]{display:none!important}.error[v-cloak]{display:block!important;visibility:hidden}
  *{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0}body{font-family:-apple-system,"Microsoft YaHei","Segoe UI",system-ui,sans-serif;overflow:hidden;background:#E8F0ED}button,input{font:inherit}
  .login-layout{position:relative;width:100%;height:100%;min-height:600px;background:#E8F0ED;overflow:hidden}
  .login-layout::before{content:"";position:fixed;z-index:0;inset:0;background:#E8F0ED url('/static/assets/login-wellbeing-lake.webp') center center/cover no-repeat;transform:translateZ(0);will-change:transform;pointer-events:none}
  .login-layout::after{content:"";position:fixed;z-index:0;inset:0;background:linear-gradient(90deg,rgba(238,244,240,.04) 0%,rgba(238,244,240,.10) 42%,rgba(238,244,240,.52) 100%);transform:translateZ(0);pointer-events:none}
  .brand-panel{position:absolute;z-index:1;top:52px;left:58px;color:#24483B}.brand-content{padding:12px 16px;border-radius:15px;background:rgba(250,252,249,.72);border:1px solid rgba(255,255,255,.55)}
  .system-name{margin:0;color:#315849;font-size:16px;font-weight:600;letter-spacing:.14em}
  .form-panel{position:relative;z-index:1;display:flex;align-items:center;justify-content:flex-end;width:100%;height:100%;padding:40px 11.5% 40px 45%}
  .form-content{width:min(460px,100%);padding:34px 36px;border:1px solid rgba(255,255,255,.75);border-radius:28px;background:rgba(248,251,248,.88);box-shadow:0 22px 55px rgba(55,83,71,.14)}
  .form-heading{margin-bottom:24px}.form-kicker{margin:0 0 4px;color:#5D897A;font-size:14px;font-weight:600}.form-title{margin:0;color:#2E4A40;font-size:24px;line-height:1.35;font-weight:700}.form-subtitle{margin:4px 0 0;color:#80938A;font-size:14px}.fields{display:grid;grid-template-columns:1fr;gap:4px}.field-label{display:block;margin-bottom:7px;color:#4B625C;font-size:14px;font-weight:600}.form-input{width:100%;height:56px;border:1px solid rgba(115,143,133,.35);border-radius:14px;background:rgba(255,255,255,.85);padding:0 17px;color:#263C35;font-size:17px;transition:border-color .12s ease,box-shadow .12s ease}.form-input:focus{outline:0;border-color:#79A99A;box-shadow:0 0 0 4px rgba(128,171,155,.16)}.form-input.invalid{border-color:#E96B6B}
  .primary-button{width:100%;height:54px;margin-top:15px;border:0;border-radius:14px;color:#fff;font-size:16px;font-weight:600;background:linear-gradient(135deg,#668D7E,#3E7367);box-shadow:0 10px 24px rgba(62,115,103,.22)}.error{min-height:18px;margin-top:5px;color:#D85B5B;font-size:12px}
  /* 身份证字段：只读展示 + 自带数字键盘，系统输入法不弹 */
  .id-field-wrap{position:relative}
  .id-progress{position:absolute;right:2px;top:2px;font-size:12px;color:#6C8B7D;font-variant-numeric:tabular-nums}
  .id-progress.ok{color:#2F8F6B;font-weight:700}
  #id-card-input{cursor:pointer;letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .id-caret{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:2px;height:26px;background:#3E7367;border-radius:1px;animation:caret-blink 1.1s steps(1) infinite}
  @keyframes caret-blink{50%{opacity:0}}
  /* 自带数字键盘（布局一部分，物理上不可能遮挡输入框）；不含 backdrop-filter 保证低端GPU流畅 */
  .id-keypad{position:absolute;z-index:2;top:50%;right:calc(11.5% + 478px);width:min(340px,40vw);padding:16px 16px 14px;border:1px solid #DCE6E1;border-radius:22px;background:#F5F8F6;box-shadow:0 8px 22px rgba(55,83,71,.12);transform:translate3d(0,-50%,0);contain:layout paint style;backface-visibility:hidden;opacity:0;visibility:hidden;pointer-events:none}
  .id-keypad.open{opacity:1;visibility:visible;pointer-events:auto}
  .kp-title{margin:0 0 10px;padding-left:4px;font-size:12px;font-weight:600;color:#4B625C;letter-spacing:.08em}
  .kp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .kp-key{height:56px;border:1px solid #CBDAD3;border-radius:12px;background:#fff;font-size:21px;font-weight:600;color:#263C35;transition:background .06s ease;touch-action:manipulation;user-select:none}
  .kp-key:active{background:#E4EDE6}
  .kp-key.fn{background:rgba(102,141,126,.13);font-size:14px;font-weight:600;color:#3E6154}
  .kp-key.fn:active{background:rgba(102,141,126,.24)}
  .kp-key.x-key:disabled{opacity:.35}
  .kp-key.done{background:#4E7F70;color:#fff;font-size:15px}
  .kp-key.span2{grid-column:span 2}
  .kp-key.big{font-size:26px}
  .privacy{margin:12px 0 0;color:#8A9B92;font-size:12px;text-align:center}
  @media(max-height:680px){.brand-panel{top:28px;left:38px}.form-panel{padding-top:18px;padding-bottom:18px}.form-content{padding:22px 28px}.form-heading{margin-bottom:14px}.form-input{height:48px}.primary-button{height:48px;margin-top:9px}.privacy{margin-top:7px}.error{min-height:14px}.id-keypad{width:320px;padding:12px}.kp-key{height:48px;font-size:19px}.kp-grid{gap:8px}}
  @media(max-width:800px),(orientation:portrait){.login-layout::before{background-position:38% center}.login-layout::after{background:rgba(239,245,241,.52)}.brand-panel{top:24px;left:24px}.form-panel{justify-content:center;padding:98px 24px 24px}.form-content{max-width:480px}.form-heading{text-align:center}.id-keypad{position:fixed;top:auto;right:24px;bottom:24px;width:calc(100% - 48px);max-width:480px;transform:none}}
</style>
</head>
<body>
<main id="app">
  <div class="login-layout">
    <section class="brand-panel" aria-label="心理健康测评欢迎界面">
      <div class="brand-content">
        <p class="system-name">心理健康测评系统</p>
      </div>
    </section>

    <section class="form-panel">
      <!-- 自带数字键盘：身份证专用，系统输入法不参与 -->
        <div class="id-keypad" :class="{open:idPadOpen}" aria-label="身份证数字键盘" v-cloak>
          <p class="kp-title">身份证号键盘 · 已输入 {{idCard.length}}/18 位</p>
          <div class="kp-grid">
            <button type="button" class="kp-key" @click="idKey('1')">1</button>
            <button type="button" class="kp-key" @click="idKey('2')">2</button>
            <button type="button" class="kp-key" @click="idKey('3')">3</button>
            <button type="button" class="kp-key fn big" @click="idBackspace" aria-label="退格">⌫</button>
            <button type="button" class="kp-key" @click="idKey('4')">4</button>
            <button type="button" class="kp-key" @click="idKey('5')">5</button>
            <button type="button" class="kp-key" @click="idKey('6')">6</button>
            <button type="button" class="kp-key fn" @click="idClear">清空</button>
            <button type="button" class="kp-key" @click="idKey('7')">7</button>
            <button type="button" class="kp-key" @click="idKey('8')">8</button>
            <button type="button" class="kp-key" @click="idKey('9')">9</button>
            <button type="button" class="kp-key x-key" :disabled="idCard.length !== 17" @click="idKey('X')" title="仅第18位可为 X">X</button>
            <button type="button" class="kp-key span2" @click="idKey('0')">0</button>
            <button type="button" class="kp-key span2 done" @click="idDone">完成</button>
          </div>
        </div>

      <div class="form-content">
        <header class="form-heading"><p class="form-kicker">欢迎使用</p><h2 class="form-title">请填写测评信息</h2><p class="form-subtitle">身份信息仅用于本次测评</p></header>
        <div class="fields">
          <div><label class="field-label" for="name-input">真实姓名</label><input id="name-input" v-model="name" @focus="handleNameFocus" @blur="handleNameBlur" @input="errors.name=''" @keydown.enter.prevent="activateIdCard" type="text" maxlength="20" autocomplete="off" enterkeyhint="next" placeholder="请输入姓名" class="form-input" :class="{invalid:errors.name}"/><p class="error" v-cloak>{{errors.name}}</p></div>
          <div class="id-field-wrap"><span class="id-progress" :class="{ok:idCardValid}" v-cloak>{{idCard.length}}/18<span v-if="idCardValid"> ✓</span></span><label class="field-label" for="id-card-input">身份证号码</label><input id="id-card-input" :value="idCardDisplay" @focus="openIdPad" @click="openIdPad" @keydown.enter.prevent="idDone" type="text" inputmode="none" readonly autocomplete="off" placeholder="请输入18位身份证号码" class="form-input" :class="{invalid:errors.idCard}"/><span v-if="idPadOpen && idCard.length < 18" class="id-caret" aria-hidden="true" v-cloak></span><p class="error" v-cloak>{{errors.idCard}}</p></div>
        </div>
        <button class="primary-button" type="button" @click="submit">开始测评</button><p class="privacy">您的身份信息将被严格保密</p>
      </div>
    </section>
  </div>
</main>
<script src="/static/assets/vendor/vue.global.prod.js"></script>
<script>
const{createApp,ref,reactive,computed}=Vue;
createApp({setup(){
  const name=ref(""),idCard=ref("");const errors=reactive({name:"",idCard:""});const idPadOpen=ref(false);
  const idCardValid=computed(()=>/^\d{17}[\dX]$/.test(idCard.value));
  const idCardDisplay=computed(()=>{const r=idCard.value;return (r.slice(0,6)+" "+r.slice(6,14)+" "+r.slice(14)).trim()});
  function validateName(){const v=name.value.trim();errors.name=v.length<2||v.length>20?"请输入2—20个字符的真实姓名":"";return!errors.name}
  function validateIdCard(){errors.idCard=/^\d{17}[\dX]$/.test(idCard.value)?"":"请输入完整的18位身份证号码";return!errors.idCard}
  function openIdPad(){idPadOpen.value=true;errors.idCard=""}
  function idKey(k){if(idCard.value.length>=18)return;if(k==="X"&&idCard.value.length!==17)return;idCard.value=(idCard.value+k).slice(0,18);errors.idCard=""}
  function idBackspace(){idCard.value=idCard.value.slice(0,-1);errors.idCard=""}
  function idClear(){idCard.value="";errors.idCard=""}
  function idDone(){idPadOpen.value=false}
  function handleNameFocus(){idDone()}
  function handleNameBlur(){}
  function activateIdCard(){document.getElementById("id-card-input")?.focus();openIdPad()}
  function submit(){validateName();validateIdCard();if(errors.name||errors.idCard)return;localStorage.setItem("psych_user",JSON.stringify({name:name.value.trim(),id_card:idCard.value}));location.href="/demo"}
  return{name,idCard,errors,idPadOpen,idCardValid,idCardDisplay,openIdPad,idKey,idBackspace,idClear,idDone,handleNameFocus,handleNameBlur,activateIdCard,submit};
}}).mount("#app");
</script>
</body>
</html>
